name: Tests

on:
  push:
    branches: [main, "copilot/**"]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    name: Flutter Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.41.8"
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Analyze code
        run: flutter analyze lib/

      - name: Run tests
        run: flutter test

  web:
    # Browser runs of the whole pure-Dart suite (issue #34) with both web
    # compilers. `tests` can narrow a compiler to some files; it is empty, so
    # both run everything (dart2js has run the whole suite since issue #36).
    name: Web tests (${{ matrix.compiler }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - compiler: dart2wasm
            tests: ""
          - compiler: dart2js
            tests: ""

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.41.8"
          channel: stable
          cache: true

      - name: Install dependencies
        run: dart pub get

      - name: Run tests on Chrome (${{ matrix.compiler }})
        run: dart test -p chrome -c ${{ matrix.compiler }} ${{ matrix.tests }}
