name: awesome_flutter_auth
description: >-
  A Flutter/Dart authentication client for awesome-lang-auth servers.
  Supports web (including WASM) via cookie + CSRF and native platforms via
  Bearer token.
version: 1.10.4
homepage: https://github.com/awesome-lang-auth/awesome-flutter-auth
repository: https://github.com/awesome-lang-auth/awesome-flutter-auth
issue_tracker: https://github.com/awesome-lang-auth/awesome-flutter-auth/issues
documentation: https://pub.dev/documentation/awesome_flutter_auth/latest/

topics:
  - authentication
  - auth
  - flutter
  - wasm

environment:
  sdk: '>=3.5.0 <4.0.0'

dependencies:
  ed25519_edwards: ^0.3.2
  http: ^1.6.0
  web: ^1.1.1

dev_dependencies:
  lints: ^6.1.0
  mocktail: ^1.0.0
  test: ^1.25.0
